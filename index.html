<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
body {
  margin: 0;
  background-color: gray;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Área do resultado */
#resultado {
  flex: 1; /* ocupa mais espaço */
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #222;
  color: white;
  font-size: 3em; /* bem grande */
  padding: 20px;
  box-sizing: border-box;
}

/* Área dos botões */
#teclado {
  flex: 1; /* ocupa metade da tela */
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* 4 colunas */
  gap: 10px;
  padding: 20px;
  background-color: #444;
  box-sizing: border-box;
}

#teclado input {
  width: 100%;
  height: 60px;
  font-size: 1.5em;
  cursor: pointer;
  border: none;
  border-radius: 5px;
}

#teclado input:hover {
  background-color: green;
  color: white;
}
</style>
</head>
<body>

<!-- Resultado -->
<div id="resultado">
  <input id="cont" type="text" disabled style="width:100%; text-align:right; font-size:inherit; background:none; border:none; color:white;">
</div>

<!-- Teclado -->
<div id="teclado">
  <!-- Operadores -->
  <input onclick='r("+")' type='button' value='+'>
  <input onclick='r("-")' type='button' value='-'>
  <input onclick='r("*")' type='button' value='*'>
  <input onclick='r("/")' type='button' value='÷'>

  <!-- Números -->
  <input onclick='adicionar(7)' type='button' value='7'>
  <input onclick='adicionar(8)' type='button' value='8'>
  <input onclick='adicionar(9)' type='button' value='9'>
  <input onclick='adicionar(3)' type='button' value='0'>

  <input onclick='adicionar(4)' type='button' value='4'>
  <input onclick='adicionar(5)' type='button' value='5'>
  <input onclick='adicionar(6)' type='button' value='6'>
  <input onclick='adicionar(3)' type='button' value=''>
  
  <input onclick='adicionar(1)' type='button' value='1'>
  <input onclick='adicionar(2)' type='button' value='2'>
  <input onclick='adicionar(3)' type='button' value='3'>

  
  <input onclick='adicionar(0)' type='button' value=''>
  <input onclick='concluir()' type='button' value='='>
  <input onclick='limpar()' type='button' value='DEL'>
  <input onclick='adicionar("(")' type='button' value='('>
  <input onclick='adicionar(")")' type='button' value=')'>

</div>

<script>
var contador = document.getElementById('cont');
var op = '';

function adicionar(numero) {
  contador.value += numero;
}

function r(operador) {
  contador.value += operador;
  op = operador;
}

function concluir() {
  try {
    var resul = eval(contador.value);
    contador.value = resul;
  } catch {
    contador.value = "Erro";
  }
}

function limpar() {
  contador.value = '';
}
</script>
</body>
</html>
